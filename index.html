<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Password Simulator (Fast)</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🔐 Fast Simulator</h1>
      <p class="subtitle">Brute-force up to 6 chars (JS Optimized)</p>
    </header>

    <main>
      <label for="password">Target password (1–6 chars):</label>
      <input id="password" type="text" value="abc12" maxlength="6" />

      <label for="charset">Character set:</label>
      <input id="charset" type="text" value="abcdefghijklmnopqrstuvwxyz0123456789" />

      <div style="display:flex; gap:10px;">
        <button id="startBtn" style="flex:2;">▶ Start</button>
        <button id="stopBtn" style="flex:1; background:#dc2626;" disabled>⏹ Stop</button>
      </div>

      <div id="status" class="status">Idle</div>
      <pre id="log"></pre>
    </main>

    <footer>
      ⚠️ For educational purposes only.
    </footer>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
