name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # 1. ساخت پوشه www و کپی فایل ها
      - name: Create www folder and copy files
        run: |
          mkdir -p www
          cp index.html www/
          cp -r src www/

      # 2. ساخت پروژه اندروید (این مرحله قبلا جا افتاده بود)
      - name: Add Android Platform
        run: npx cap add android

      # 3. همگام سازی
      - name: Capacitor Sync
        run: npx cap sync

      # 4. ساخت فایل APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. آپلود فایل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
